# Reusable workflow: build a course repository and publish it to GitHub Pages.
#
# Call it from a course repository, e.g. .github/workflows/publish.yml:
#
#   permissions:
#     contents: read
#     pages: write
#     id-token: write
#   jobs:
#     publish:
#       uses: SaxionACS/course-tools/.github/workflows/publish-course.yml@v2
#
# The course repository must have Settings > Pages > Source set to
# "GitHub Actions".

name: Publish course

on:
  workflow_call:
    inputs:
      tools-ref:
        description: Version of course-tools to build with (keep equal to the @ref of this workflow).
        type: string
        default: v2
      quarto-version:
        description: Another Quarto version than the one course-tools pins (not checked against a SHA-256).
        type: string
        default: ""
      plantuml-version:
        description: Another PlantUML version than the one course-tools pins (not checked against a SHA-256).
        type: string
        default: ""
      deploy:
        description: Publish to GitHub Pages (false = only check that the course builds).
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read        # configure-pages reads the site URL
    steps:
      - name: Check out the course
        uses: actions/checkout@v7
        with:
          lfs: true
          fetch-depth: 0      # full history: pages show when they were added and last changed

      - name: Check out course-tools
        uses: actions/checkout@v7
        with:
          repository: SaxionACS/course-tools
          ref: ${{ inputs.tools-ref }}
          path: .course-tools

      - name: Install Graphviz (needed by most PlantUML diagrams)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Install course-tools
        id: course-tools
        run: |
          uv tool install --python 3.12 ./.course-tools
          uv tool dir --bin >> "$GITHUB_PATH"
          echo "version=$("$(uv tool dir --bin)/course" --version)" >> "$GITHUB_OUTPUT"

      # Quarto, PlantUML and Chrome Headless Shell: the same for every build with this course-tools version.
      - name: Cache the tools
        uses: actions/cache@v6
        with:
          path: ~/.local/share/course-tools
          key: course-tools-${{ runner.os }}-${{ steps.course-tools.outputs.version }}-${{ inputs.quarto-version }}-${{ inputs.plantuml-version }}

      - name: Set up the tools
        env:
          QUARTO_VERSION: ${{ inputs.quarto-version }}
          PLANTUML_VERSION: ${{ inputs.plantuml-version }}
        run: course setup ${QUARTO_VERSION:+--quarto "$QUARTO_VERSION"} ${PLANTUML_VERSION:+--plantuml "$PLANTUML_VERSION"}

      - name: Check tools
        run: course doctor

      - name: Configure GitHub Pages
        id: pages
        if: inputs.deploy
        uses: actions/configure-pages@v6

      - name: Build the course
        run: course build --site-url "${{ steps.pages.outputs.base_url }}"

      - name: Upload the website
        if: inputs.deploy
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: inputs.deploy
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
