# Check course-tools: build the test course (tests/course) with this commit
# and check the result (scripts/check.py). Runs on every push to every branch,
# on Ubuntu only. Nothing is published.
#
# Merge a branch into main only when this check has passed on its last commit.
# The tools are installed as in publish-course.yml; keep the versions equal.

name: Check

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  QUARTO_VERSION: "1.10.18"
  PLANTUML_VERSION: "1.2026.8"

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out course-tools
        uses: actions/checkout@v7

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ env.QUARTO_VERSION }}

      - name: Install Chrome Headless Shell (Mermaid diagrams in PDFs)
        run: quarto install chrome-headless-shell --no-prompt

      - name: Install Lato, Graphviz and pdftotext
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-lato graphviz poppler-utils

      - name: Cache PlantUML
        id: plantuml-cache
        uses: actions/cache@v6
        with:
          path: ~/plantuml
          key: plantuml-${{ env.PLANTUML_VERSION }}

      - name: Download PlantUML
        if: steps.plantuml-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/plantuml
          curl -fsSL -o ~/plantuml/plantuml.jar \
            "https://github.com/plantuml/plantuml/releases/download/v${PLANTUML_VERSION}/plantuml-${PLANTUML_VERSION}.jar"

      - name: Install course-tools from this commit
        run: |
          pipx install .
          echo "PLANTUML_JAR=$HOME/plantuml/plantuml.jar" >> "$GITHUB_ENV"

      - name: Check
        run: python3 scripts/check.py
