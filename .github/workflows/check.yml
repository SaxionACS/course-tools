# Check course-tools: build the test course (tests/course) with this commit
# and check the result (scripts/check.py). Runs on every push to every branch,
# on Ubuntu only. Nothing is published.
#
# Merge a branch into main only when this check has passed on its last commit.
# The tools are installed as in publish-course.yml.

name: Check

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out course-tools
        uses: actions/checkout@v7

      - name: Install Graphviz and poppler (pdftotext, pdffonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends graphviz poppler-utils

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2   # no major-version tags: pin a release

      - name: Install course-tools from this commit
        run: |
          uv tool install --python 3.12 .
          uv tool dir --bin >> "$GITHUB_PATH"

      # The pins are in src/course_tools/tools.py: a new pin gets a new cache.
      - name: Cache the tools
        uses: actions/cache@v6
        with:
          path: ~/.local/share/course-tools
          key: course-tools-${{ runner.os }}-${{ hashFiles('src/course_tools/tools.py') }}

      - name: Set up the tools
        run: course setup

      - name: Check
        run: python3 scripts/check.py
