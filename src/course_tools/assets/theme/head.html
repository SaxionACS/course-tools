<script>
  // Embedded mode: when a page is shown inside another site (Brightspace
  // embeds web links in an iframe), hide the website chrome so only the
  // content remains. `?embed=1` / `?embed=0` force the mode for testing.
  (function () {
    var embedded;
    try { embedded = window.self !== window.top; } catch (e) { embedded = true; }
    var params = new URLSearchParams(window.location.search);
    if (params.has('embed')) embedded = params.get('embed') !== '0';
    if (embedded) document.documentElement.classList.add('embedded');
  })();

  document.addEventListener('DOMContentLoaded', function () {
    // Move the PDF button (added by filters/course.lua) next to the page title.
    var button = document.querySelector('.course-pdf');
    var title = document.querySelector('#title-block-header .quarto-title');
    if (button && title) {
      title.insertBefore(button, title.firstChild);
      button.classList.add('in-title');
    }

    // PDF files open in a new tab, in the browser's PDF viewer. The filter does
    // this for links in the content; this covers links that Quarto makes, such
    // as PDFs in the sidebar.
    document.querySelectorAll('a[href]').forEach(function (a) {
      if (/\.pdf$/i.test(a.pathname)) {
        a.setAttribute('target', '_blank');
        a.setAttribute('rel', 'noopener');
        a.removeAttribute('download');
      }
    });

    // Code annotations: Quarto floats the numbers to the right edge of the
    // code block. Put each number after the code of its line instead, aligned
    // in one column two characters after the longest annotated line (margins
    // in `ch`, the width of a code character). The number is shown by CSS
    // (saxion.scss), so copying the code does not include it.
    document.querySelectorAll('code.sourceCode').forEach(function (code) {
      var marked = [];
      code.querySelectorAll(':scope > a.code-annotation-anchor').forEach(function (anchor) {
        var line = anchor.nextElementSibling;
        if (line && line.classList.contains('code-annotation-target')) marked.push([anchor, line]);
      });
      var length = function (line) { return line.textContent.replace(/\s+$/, '').length; };
      var longest = 0;
      marked.forEach(function (m) { longest = Math.max(longest, length(m[1])); });
      marked.forEach(function (m) {
        var pad = document.createElement('span');
        pad.style.marginLeft = (longest - length(m[1]) + 2) + 'ch';
        m[0].textContent = '';
        m[0].classList.add('course-inline');
        pad.appendChild(m[0]);
        m[1].appendChild(pad);
      });
    });
  });
</script>
