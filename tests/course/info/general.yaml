# The test course of course-tools (see scripts/check.py).
title: Check Course
code: T.ACS.CHECK
academic_year: 2026-2027
period: Quartile 1
credits: 5
language: English
programme: Applied Computer Science

coordinator:
  name: Test Coordinator
  email: coordinator@example.org

lecturers:
  - name: Test Lecturer
    email: lecturer@example.org
    role: lecturer

description: |
  A small course that uses every feature of course-tools.

prerequisites: |
  None.

learning_outcomes:
  introduction: |
    After this course, you can:
  items:
    - id: LO1
      title: Superloops
      text: Write a superloop in C.
    - id: LO2                            # no title: the id is shown
      text: Share data safely between an interrupt handler and the main loop.
    - id: LO3
      title: Debugging
      text: Find bugs in embedded programs with a debugger.

levels:
  independence: low
  complexity: middle
  interdisciplinarity: low

literature:
  mandatory:
    - B. W. Kernighan and D. M. Ritchie, *The C Programming Language*, 2nd ed., 1988.
  optional:
    - E. White, *Making Embedded Systems*, 2nd ed., O'Reilly, 2024.

# Compiler Explorer links on code blocks (```{c ce=asm}).
compiler_explorer:
  target: ARM Cortex-M0+
  compiler: carmug1520
  options: -O2 -mcpu=cortex-m0plus -mthumb
  run:
    target: x86-64
    compiler: cg152
    options: -O2

links:
  items:
    - title: Quarto
      url: https://quarto.org/
